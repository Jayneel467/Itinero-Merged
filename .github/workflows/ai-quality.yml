name: AI quality gates

on:
  push:
    paths:
      - "general_agent/**"
      - "supervisor/intent_router.py"
      - "supervisor/tests/test_ai_quality_gates.py"
      - "supervisor/tests/test_ai_stack_smoke.py"
      - ".github/workflows/ai-quality.yml"
  pull_request:
    paths:
      - "general_agent/**"
      - "supervisor/intent_router.py"
      - "supervisor/tests/test_ai_quality_gates.py"
      - "supervisor/tests/test_ai_stack_smoke.py"
      - ".github/workflows/ai-quality.yml"
  workflow_dispatch:

jobs:
  offline-gates:
    name: Offline agentic gates (no LLM keys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            general_agent/requirements.txt
      - name: Install agent deps
        run: |
          python -m pip install --upgrade pip
          pip install -r general_agent/requirements.txt
          pip install langchain-core openai pydantic python-dotenv
      - name: Run offline AI quality gates
        env:
          VERO_LLM_COMBO: "0"
          VERO_LLM_ROUTER: "1"
        run: python -m supervisor.tests.test_ai_quality_gates

  # Optional live smoke — only when secrets exist (manual / main).
  live-smoke:
    name: Live AI stack smoke (optional secrets)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: offline-gates
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            general_agent/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r general_agent/requirements.txt
      - name: Live smoke (skips when keys missing)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m supervisor.tests.test_ai_stack_smoke
        continue-on-error: true

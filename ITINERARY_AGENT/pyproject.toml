[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-travel-planner"
version = "1.0.0"
description = "Production-quality AI Travel Planner using LangGraph multi-agent architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "colorama>=0.4.6",
]

[project.scripts]
travel-planner = "ai_travel_planner.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_travel_planner*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

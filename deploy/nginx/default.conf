# Itinero edge nginx — SPA under /itinero/, API proxy to supervisor
upstream supervisor_upstream {
    server supervisor:8000;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS only meaningful behind TLS terminator (Cloudflare / LB)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Liveness for the edge itself (not proxied)
    location = /api/health/live {
        proxy_pass http://supervisor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # API → supervisor (includes /api/health)
    location /api/ {
        proxy_pass http://supervisor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 12m;
    }

    # Hashed Vite assets — long cache
    location /itinero/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # SPA under /itinero/ (files live at /usr/share/nginx/html/itinero/)
    location /itinero/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /itinero/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /itinero {
        return 301 /itinero/;
    }

    location = / {
        return 302 /itinero/;
    }
}
